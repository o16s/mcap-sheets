name: Release package

on:
  release:
    types: [published]

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'

  publish:
    needs: build-and-pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Publish to GitHub Packages; writes an .npmrc that maps the @o16s
          # scope to this registry and wires up token auth.
          registry-url: 'https://npm.pkg.github.com'
          scope: '@o16s'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm publish
        env:
          # Built-in token with packages:write — no external secret needed.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
